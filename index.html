<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ficha Ninja</title>
<meta name="description" content="Protótipo de ficha de personagem para o RPG de Naruto (sistema próprio).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=JetBrains+Mono:wght@500;700&family=Shippori+Mincho+B1:wght@800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topo" id="topo">
  <div class="topo-linha">
    <div class="topo-id">
      <div class="selo" id="seloRank" title="Rank do ninja"><span class="selo-rot">Rank</span><span class="selo-letra" id="seloLetra">D</span></div>
      <div class="topo-nome">
        <input id="topoNome" class="nome-grande" data-k="nome" placeholder="Nome do ninja" aria-label="Nome do ninja">
        <div class="topo-sub" id="topoSub"></div>
      </div>
    </div>
    <div class="topo-acoes">
      <div class="nivel-ctl" aria-label="Nível">
        <button class="btn-ico" id="nivelMenos" aria-label="Diminuir nível">−</button>
        <div class="nivel-val"><span class="rot">Nível</span><span id="nivelVal" class="num">1</span></div>
        <button class="btn-ico" id="nivelMais" aria-label="Aumentar nível">+</button>
      </div>
      <button class="btn" id="btnFichas" aria-haspopup="dialog">Fichas</button>
    </div>
  </div>
  <div class="barras">
    <div class="barra-bloco">
      <div class="barra-rot"><span>Vida</span><span class="num" id="barVidaTxt">0 / 0</span></div>
      <div class="barra"><div class="barra-sobre" id="barVidaSobre"></div><div class="barra-fill vida" id="barVida"></div></div>
    </div>
    <div class="barra-bloco">
      <div class="barra-rot"><span>Chakra</span><span class="num" id="barChakraTxt">0 / 0</span></div>
      <div class="barra"><div class="barra-sobre" id="barChakraSobre"></div><div class="barra-fill chakra" id="barChakra"></div></div>
    </div>
  </div>
  <nav class="abas" role="tablist" aria-label="Seções da ficha">
    <button role="tab" data-aba="ficha" aria-selected="true">Ficha</button>
    <button role="tab" data-aba="jutsus">Jutsus</button>
    <button role="tab" data-aba="inventario">Inventário</button>
    <button role="tab" data-aba="evolucao">Evolução</button>
    <button role="tab" data-aba="aliados">Aliados</button>
    <button role="tab" data-aba="especial">Especial</button>
    <button role="tab" data-aba="historia">História</button>
  </nav>
</header>

<main id="conteudo" class="conteudo"></main>

<footer class="rodape">
  <span id="salvoStatus">Salvo neste navegador</span>
  <span>Protótipo baseado nos documentos do RPG Naruto. Regras podem mudar.</span>
</footer>

<div class="modal" id="modal" hidden>
  <div class="modal-fundo" data-fechar></div>
  <div class="modal-caixa" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
    <div class="modal-topo">
      <h2 id="modalTitulo"></h2>
      <button class="btn-ico" data-fechar aria-label="Fechar">×</button>
    </div>
    <div class="modal-corpo" id="modalCorpo"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/data/regras.js"></script>
<script src="js/data/jutsus.js"></script>
<script src="js/data/itens.js"></script>
<script src="js/data/criaturas.js"></script>
<script src="js/app.js"></script>
</body>
</html>
